name: SAMAI landing checks and release
on:
  push:
    branches: [samai-landing, samai-landing-v05, samai-landing-v06, samai-landing-v07]
    paths: ['site/**', 'tools/**', '.github/workflows/samai-landing.yml', 'requirements-ci.txt']
permissions:
  contents: read
concurrency:
  group: samai-landing-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  verify-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate all JavaScript
        run: |
          for file in site/*.js; do
            node --check "$file"
          done
      - name: Install browser gate
        run: |
          pip install -r requirements-ci.txt
          python -m playwright install --with-deps chromium firefox webkit
      - name: Build exact commit
        run: python tools/build.py
      - name: Mandatory Chromium, Firefox and WebKit browser gate
        run: python tools/browser_gate.py
      - name: Save checks screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: samai-checks-${{ github.sha }}
          path: artifacts/
          retention-days: 14
      - name: Checkout isolated release working copy
        if: github.ref_name == 'samai-landing'
        uses: actions/checkout@v4
        with:
          path: release-store
      - name: Publish tested static release
        if: github.ref_name == 'samai-landing'
        run: sh tools/publish.sh
      - name: Save tested build
        uses: actions/upload-artifact@v4
        with:
          name: samai-build-${{ github.sha }}
          path: dist/
          retention-days: 14
      - name: Release summary
        run: |
          echo "Verified build: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          if [ "$GITHUB_REF_NAME" = "samai-landing" ]; then
            echo 'REG may activate this build only after this complete workflow succeeds.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Feature build verified; it is not published to REG.' >> "$GITHUB_STEP_SUMMARY"
          fi
