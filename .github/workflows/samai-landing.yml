# Exact-head CI verification after conflict resolution
name: SAMAI landing checks and release
on:
  push:
    branches: [samai-landing, samai-landing-v05, samai-landing-v06, samai-landing-v07, samai-landing-v08, samai-landing-v09, samai-landing-v10-copy, samai-landing-v11-trust, samai-qualified-leads-v12, samai-release-publish-fix, samai-live-v12-fix, samai-qualified-leads-analytics, samai-v12-full-motion-default]
    paths: ['site/**', 'prototypes/qualified-leads-motion-v1/**', 'tools/**', '.github/workflows/samai-landing.yml', '.github/workflows/samai-live-check.yml', 'requirements-ci.txt']
permissions:
  contents: read
concurrency:
  group: samai-landing-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  verify-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: prototypes/qualified-leads-motion-v1/pnpm-lock.yaml
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate all JavaScript
        run: |
          for file in site/*.js; do
            node --check "$file"
          done
          for file in prototypes/qualified-leads-motion-v1/src/*.js; do
            node --check "$file"
          done
      - name: Install qualified-leads build dependencies
        run: pnpm --dir prototypes/qualified-leads-motion-v1 install --frozen-lockfile
      - name: Install browser gate
        run: |
          pip install -r requirements-ci.txt
          python -m playwright install --with-deps chromium firefox webkit
      - name: Build exact commit
        run: |
          pnpm --dir prototypes/qualified-leads-motion-v1 run build
          python tools/build_v12.py
      - name: Hemingway-style Russian content gate
        run: python tools/content_gate.py
      - name: Mandatory v12 Chromium, Firefox and WebKit release gate
        run: python tools/v12_gate.py
      - name: Save checks screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: samai-checks-${{ github.sha }}
          path: artifacts/
          retention-days: 14
      - name: Checkout isolated release working copy
        if: github.ref_name == 'samai-landing'
        uses: actions/checkout@v4
        with:
          path: release-store
      - name: Publish tested static release
        if: github.ref_name == 'samai-landing'
        run: sh tools/publish.sh
      - name: Save tested build
        uses: actions/upload-artifact@v4
        with:
          name: samai-build-${{ github.sha }}
          path: dist/
          retention-days: 14
      - name: Release summary
        run: |
          echo "Verified build: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          if [ "$GITHUB_REF_NAME" = "samai-landing" ]; then
            echo 'REG may activate this build only after this complete workflow succeeds.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Feature build verified; it is not published to REG.' >> "$GITHUB_STEP_SUMMARY"
          fi
